[package]
name = "tb-render"
version = "0.1.0"
edition = "2021"
description = "Headless HTML/CSS -> PNG renderer for tb, built on Blitz (Stylo CSS engine + Taffy layout + Vello CPU painter). No browser, no GPU required."

[[bin]]
name = "tb-render"
path = "src/main.rs"

[dependencies]
# Blitz: a real, modular web rendering engine in Rust.
#   blitz-dom   — DOM + style resolution (Stylo, Firefox's CSS engine) + layout (Taffy) + text (Parley)
#   blitz-html  — html5ever-based HTML parsing into a Blitz document
#   blitz-paint — turns the laid-out DOM into 2D draw commands
#   blitz-traits — shared types (Viewport, ColorScheme, ...)
blitz-dom = "0.2"
blitz-html = "0.2"
blitz-traits = "0.2"
blitz-paint = "0.2"

# anyrender: 2D drawing abstraction + a pure-CPU (software) Vello backend, so we
# paint to a pixel buffer with no GPU/Vulkan needed — ideal for headless servers.
anyrender = "0.6"
anyrender_vello_cpu = "0.7"

# PNG encoding.
png = "0.17"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
