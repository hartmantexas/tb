<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="12" fill="url(#bg)"/>
  <rect x="0" y="216" width="900" height="4" rx="2" fill="url(#accent)"/>

  <!-- Browser icon -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="22" rx="8" fill="#1a1a1a"/>
    <rect x="0" y="14" width="120" height="8" fill="#1a1a1a"/>
    <circle cx="14" cy="11" r="4" fill="#ea4335"/>
    <circle cx="28" cy="11" r="4" fill="#e8b931"/>
    <circle cx="42" cy="11" r="4" fill="#34a853"/>
    <rect x="54" y="7" width="56" height="8" rx="4" fill="#252525"/>

    <!-- Content lines -->
    <rect x="10" y="32" width="60" height="4" rx="2" fill="#4285f4" opacity="0.7"/>
    <rect x="10" y="42" width="45" height="4" rx="2" fill="#555"/>
    <rect x="10" y="52" width="80" height="4" rx="2" fill="#555"/>
    <rect x="10" y="62" width="35" height="4" rx="2" fill="#555"/>

    <!-- Number badges -->
    <circle cx="98" cy="34" r="8" fill="#4285f4"/>
    <text x="98" y="38" text-anchor="middle" font-family="SF Mono,monospace" font-size="10" font-weight="700" fill="white">1</text>
    <circle cx="98" cy="54" r="8" fill="#34a853"/>
    <text x="98" y="58" text-anchor="middle" font-family="SF Mono,monospace" font-size="10" font-weight="700" fill="white">2</text>
    <circle cx="98" cy="74" r="8" fill="#e8b931"/>
    <text x="98" y="78" text-anchor="middle" font-family="SF Mono,monospace" font-size="10" font-weight="700" fill="white">3</text>
  </g>

  <!-- Title -->
  <text x="200" y="82" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="52" font-weight="800" fill="white">tb</text>
  <text x="265" y="82" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="52" font-weight="300" fill="#666">tiny browser</text>

  <!-- Subtitle -->
  <text x="200" y="115" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" fill="#888">Agent-first browser with site-aware scraping</text>

  <!-- Feature pills -->
  <g transform="translate(200, 135)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="45" y="17" text-anchor="middle" font-family="SF Mono,monospace" font-size="11" fill="#4285f4">tb read</text>

    <rect x="100" y="0" width="110" height="26" rx="13" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="155" y="17" text-anchor="middle" font-family="SF Mono,monospace" font-size="11" fill="#34a853">tb elements</text>

    <rect x="220" y="0" width="100" height="26" rx="13" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="270" y="17" text-anchor="middle" font-family="SF Mono,monospace" font-size="11" fill="#e8b931">tb groups</text>

    <rect x="330" y="0" width="110" height="26" rx="13" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="385" y="17" text-anchor="middle" font-family="SF Mono,monospace" font-size="11" fill="#ea4335">tb dom-diff</text>

    <rect x="450" y="0" width="120" height="26" rx="13" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="510" y="17" text-anchor="middle" font-family="SF Mono,monospace" font-size="11" fill="#8ab4f8">tb auto-extract</text>
  </g>

  <!-- Stats -->
  <g transform="translate(200, 178)">
    <text font-family="SF Mono,monospace" font-size="12" fill="#555">
      <tspan fill="#34a853">64MB</tspan> RAM with Lightpanda
      <tspan dx="16" fill="#e8b931">&#60;100ms</tspan> per command
      <tspan dx="16" fill="#4285f4">0</tspan> LLM calls needed
    </text>
  </g>
</svg>
