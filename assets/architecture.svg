<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#111122"/>
    </linearGradient>
  </defs>
  <rect width="800" height="340" rx="10" fill="url(#abg)"/>

  <text x="400" y="28" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#555" letter-spacing="2">ARCHITECTURE</text>

  <!-- Agent layer -->
  <rect x="260" y="45" width="280" height="40" rx="8" fill="#1a1a2e" stroke="#4285f4" stroke-width="1.5"/>
  <text x="400" y="70" text-anchor="middle" font-family="SF Mono,monospace" font-size="13" font-weight="600" fill="#4285f4">Your Agent / Code</text>

  <!-- Arrow -->
  <line x1="400" y1="85" x2="400" y2="105" stroke="#333" stroke-width="1.5"/>
  <polygon points="395,102 405,102 400,110" fill="#333"/>
  <text x="418" y="100" font-family="SF Mono,monospace" font-size="9" fill="#444">CLI / Library / HTTP</text>

  <!-- tb CLI layer -->
  <rect x="180" y="115" width="440" height="40" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="400" y="140" text-anchor="middle" font-family="SF Mono,monospace" font-size="13" font-weight="600" fill="#ccc">tb CLI</text>
  <!-- Command pills inside -->
  <g font-family="SF Mono,monospace" font-size="8" fill="#555">
    <text x="220" y="140">read</text>
    <text x="252" y="140">batch</text>
    <text x="290" y="140">pipe</text>
    <text x="502" y="140">groups</text>
    <text x="548" y="140">describe</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="155" x2="400" y2="175" stroke="#333" stroke-width="1.5"/>
  <polygon points="395,172 405,172 400,180" fill="#333"/>
  <text x="418" y="170" font-family="SF Mono,monospace" font-size="9" fill="#444">Unix socket</text>

  <!-- Daemon layer -->
  <rect x="140" y="185" width="520" height="50" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="400" y="207" text-anchor="middle" font-family="SF Mono,monospace" font-size="13" font-weight="600" fill="#ccc">tb daemon</text>
  <text x="400" y="225" text-anchor="middle" font-family="SF Mono,monospace" font-size="9" fill="#555">sessions / groups / DVR / DOM snapshots / events</text>

  <!-- Arrows to engines -->
  <line x1="300" y1="235" x2="250" y2="265" stroke="#34a853" stroke-width="1.5"/>
  <polygon points="246,261 254,261 250,269" fill="#34a853"/>
  <line x1="500" y1="235" x2="550" y2="265" stroke="#4285f4" stroke-width="1.5"/>
  <polygon points="546,261 554,261 550,269" fill="#4285f4"/>

  <!-- Lightpanda -->
  <rect x="140" y="270" width="220" height="55" rx="8" fill="#0d1a0d" stroke="#34a853" stroke-width="1.5"/>
  <text x="250" y="293" text-anchor="middle" font-family="SF Mono,monospace" font-size="13" font-weight="600" fill="#34a853">Lightpanda</text>
  <text x="250" y="312" text-anchor="middle" font-family="SF Mono,monospace" font-size="10" fill="#555">64MB RAM  |  Zig  |  DOM-only</text>

  <!-- Chromium -->
  <rect x="440" y="270" width="220" height="55" rx="8" fill="#0d0d1a" stroke="#4285f4" stroke-width="1.5"/>
  <text x="550" y="293" text-anchor="middle" font-family="SF Mono,monospace" font-size="13" font-weight="600" fill="#4285f4">Chromium</text>
  <text x="550" y="312" text-anchor="middle" font-family="SF Mono,monospace" font-size="10" fill="#555">829MB RAM  |  pixel-perfect</text>
</svg>
