<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <rect width="800" height="200" rx="10" fill="#0d0d0d"/>

  <text x="400" y="24" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#555" letter-spacing="2">AGENT WORKFLOW</text>

  <!-- Step 1: read -->
  <rect x="30" y="50" width="160" height="70" rx="10" fill="#1a1a1a" stroke="#4285f4" stroke-width="1.5"/>
  <text x="110" y="75" text-anchor="middle" font-family="SF Mono,monospace" font-size="12" font-weight="600" fill="#4285f4">tb read</text>
  <text x="110" y="95" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#666">Site-aware extract</text>
  <text x="110" y="110" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#444">~200 tokens output</text>

  <!-- Arrow -->
  <line x1="190" y1="85" x2="220" y2="85" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="217,80 217,90 225,85" fill="#333"/>

  <!-- Step 2: decide -->
  <rect x="225" y="50" width="140" height="70" rx="10" fill="#1a1a1a" stroke="#e8b931" stroke-width="1.5"/>
  <text x="295" y="75" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e8b931">Agent decides</text>
  <text x="295" y="95" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#666">"click login"</text>
  <text x="295" y="110" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#444">LLM only here</text>

  <!-- Arrow -->
  <line x1="365" y1="85" x2="395" y2="85" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="392,80 392,90 400,85" fill="#333"/>

  <!-- Step 3: act -->
  <rect x="400" y="50" width="140" height="70" rx="10" fill="#1a1a1a" stroke="#34a853" stroke-width="1.5"/>
  <text x="470" y="75" text-anchor="middle" font-family="SF Mono,monospace" font-size="12" font-weight="600" fill="#34a853">tb act</text>
  <text x="470" y="95" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#666">Semantic match</text>
  <text x="470" y="110" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#444">No LLM needed</text>

  <!-- Arrow -->
  <line x1="540" y1="85" x2="570" y2="85" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="567,80 567,90 575,85" fill="#333"/>

  <!-- Step 4: diff -->
  <rect x="575" y="50" width="180" height="70" rx="10" fill="#1a1a1a" stroke="#ea4335" stroke-width="1.5"/>
  <text x="665" y="75" text-anchor="middle" font-family="SF Mono,monospace" font-size="12" font-weight="600" fill="#ea4335">tb dom-diff</text>
  <text x="665" y="95" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#666">+3 added, -1 removed</text>
  <text x="665" y="110" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#444">~50 tokens, not 5000</text>

  <!-- Bottom summary -->
  <rect x="30" y="145" width="725" height="35" rx="8" fill="#111"/>
  <text x="400" y="167" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#555">
    <tspan fill="#888">10-step flow:</tspan>
    <tspan dx="6" fill="#4285f4">~300 tokens/step</tspan>
    <tspan dx="6" fill="#555">instead of</tspan>
    <tspan dx="6" fill="#ea4335">~5,000 tokens/step</tspan>
    <tspan dx="6" fill="#555">with screenshots</tspan>
  </text>
</svg>
