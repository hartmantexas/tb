name: release-render-engine

# Builds the Blitz render engine (tb-render) for each platform and attaches the
# binaries to a GitHub Release. `tb install render-engine` downloads the matching
# one (tb-render-<arch>-<os>) so users never need Rust or a 3-minute build.
#
# Trigger by pushing a tag:  git tag v0.1.1 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: x86_64-linux
          - os: ubuntu-24.04-arm
            suffix: aarch64-linux
          - os: macos-13
            suffix: x86_64-macos
          - os: macos-14
            suffix: aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path render-engine/Cargo.toml
      - name: Stage binary
        run: cp render-engine/target/release/tb-render tb-render-${{ matrix.suffix }}
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: tb-render-${{ matrix.suffix }}
          fail_on_unmatched_files: true
